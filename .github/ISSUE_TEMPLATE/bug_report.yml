name: "🐞 Bug Report"
description: Report a bug
title: "[Bug] <short summary>"
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide steps, including URLs, user type, data if applicable.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: Drag and drop or paste.
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser, OS, device, viewport, etc.
      placeholder: e.g., Chrome 129, macOS 14, 1440x900
    validations:
      required: false
