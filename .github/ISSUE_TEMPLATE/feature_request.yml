name: "✨ Feature Request"
description: Propose a feature or enhancement
title: "[Feature] <short summary>"
labels: ["feature", "needs-triage"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What’s your proposal? Include user flows if relevant.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In-scope and out-of-scope items.
    validations:
      required: false
  - type: textarea
    id: design
    attributes:
      label: Design Notes
      description: Links to Figma, components, or references.
    validations:
      required: false
