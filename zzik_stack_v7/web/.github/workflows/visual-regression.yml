name: Visual Regression Tests

on:
  pull_request:
    branches: [ main, genspark_ai_developer ]
  push:
    branches: [ main ]

jobs:
  visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'zzik_stack_v7/web/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./zzik_stack_v7/web
        run: npm ci
      
      - name: Install Playwright
        working-directory: ./zzik_stack_v7/web
        run: npx playwright install --with-deps chromium
      
      - name: Run visual regression tests
        working-directory: ./zzik_stack_v7/web
        run: npm run design:review
        continue-on-error: true
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: zzik_stack_v7/web/test-results/
          retention-days: 30
      
      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-screenshots
          path: zzik_stack_v7/web/design-reviews/screenshots/
          retention-days: 30
      
      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'zzik_stack_v7/web/test-results/results.json';
            
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const { suites } = results;
              
              let totalTests = 0;
              let passedTests = 0;
              let failedTests = 0;
              
              suites.forEach(suite => {
                suite.specs.forEach(spec => {
                  totalTests++;
                  if (spec.ok) passedTests++;
                  else failedTests++;
                });
              });
              
              const body = `## 🎨 Visual Regression Test Results
              
**Total Tests**: ${totalTests}
**✅ Passed**: ${passedTests}
**❌ Failed**: ${failedTests}

${failedTests > 0 ? '⚠️ **Visual changes detected!** Please review the screenshots in the artifacts.' : '✅ All visual tests passed!'}

[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
